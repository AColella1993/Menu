<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Bible</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#fcf0f3;--card:#fff;--text:#3b2f33;--accent:#7a2230;--line:#e6d3d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:20px 16px}
header,footer{max-width:440px;margin:0 auto 16px;font-size:13px;line-height:1.5}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;color:var(--accent);font-size:34px;margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#menu{max-width:440px;margin:0 auto 16px;display:grid;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.photo{position:relative;height:210px;background:linear-gradient(135deg,#f2a33a,#c2551d) center/cover}
.tag{position:absolute;top:14px;left:14px;background:var(--card);font-size:12px;letter-spacing:.15em;padding:8px 14px;border-radius:999px;border:1px solid var(--line)}
.body{padding:22px 22px 8px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;line-height:1.15;color:var(--accent);margin:0 0 10px}
.desc{line-height:1.55;margin:0 0 16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid}
.no{background:#fbe4e7;border-color:#e08a97;color:#8a1f2f}
.mod{background:#fff3d6;border-color:#e6c36a;color:#7a5a00}
.chk{background:#fff;border:1px dashed #b08a2e;color:#7a5a00}
.yes{background:#e6f0e2;border-color:#a9c6a0;color:#3f6b37}
.nov{background:#f1ecee;border-color:#cdbfc4;color:#6b5a60}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:16px 0;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px}
details[open] summary::after{content:"\2212"}
details div{padding:0 0 16px;line-height:1.55;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Food Bible</h1>
  Pills show allergens present in each dish. No pill means marked safe in the Food Bible.
  <div class="legend"><span class="pill no">Cannot be modified</span><span class="pill mod">Can be modified</span><span class="pill chk">Check with kitchen</span></div>
</header>
<div id="menu"></div>
<footer>The Food Bible grid has no Mollusc column: always confirm molluscs (oysters, scallops, mussels) and every allergen with the kitchen before serving.</footer>

<script>

   no: allergens that cannot be modified (comma separated)
   mod: allergens that can be modified     chk: items to check (separate with ;)
   v: vegetarian -> "yes", "no", "mod" (with changes) or "chk"
   To add a dish copy one block { } and paste it, keeping the comma.
   ========================================================== */
const dishes = [
{t:"STARTER",n:"Spring Onion and Potato Croquette",ph:"croquette.jpg",

/* ---------- Do not edit below this line ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = (s, sep) => s ? s.split(sep).map(x => x.trim()).filter(Boolean) : [];
const vegMap = {yes:["yes","Vegetarian"], no:["nov","Not vegetarian"], mod:["mod","Vegetarian with changes"], chk:["chk","Vegetarian: check"]};
const count = {};
const sec = (title, text) => text ? `<details><summary>${title}</summary><div>${esc(text)}</div></details>` : "";
document.getElementById("menu").innerHTML = dishes.map(d => {
  count[d.t] = (count[d.t] || 0) + 1;
  const v = vegMap[d.v];
  const pills = [
    ...list(d.no, ",").map(a => `<span class="pill no">${esc(a)}</span>`),
    ...list(d.mod, ",").map(a => `<span class="pill mod">${esc(a)}</span>`),
    ...list(d.chk, ";").map(a => `<span class="pill chk">${esc(a)}</span>`),
    `<span class="pill ${v[0]}">${v[1]}</span>`
  ].join("");
  return `<article class="card">
    <div class="photo" style="background-image:url('${esc(d.ph)}'),linear-gradient(135deg,#f2a33a,#c2551d)"><span class="tag">${d.t} ${count[d.t]}</span></div>
    <div class="body">
      <h2>${esc(d.n)}</h2>
      <p class="desc">${esc(d.ov)}</p>
      <div class="pills">${pills}</div>
      ${sec("Garnish", d.ga)}${sec("Extras", d.ex)}${sec("Advanced Knowledge", d.ad)}
    </div>
  </article>`;
}).join("");
</script>
</body>
</html>
